# Example Compose file. Copy to compose.yaml and adjust for your environment.
# compose.yaml itself is gitignored — keep env-specific values (ports,
# hostnames, reverse-proxy upstreams) in your local copy, not here.

services:
  ipcalc:
    image: ipcalc:latest          # or a pinned version, e.g. ipcalc:0.9.0
    container_name: ipcalc
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_PATH: "/data/ipcalc.db"
    ports:
      - "8080:8080"               # adjust host port to taste
    volumes:
      - ./data:/data              # bind mount — SQLite db lives in ./data
    # The Dockerfile already declares a HEALTHCHECK; this block makes it
    # visible to operators reading the compose file.
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
